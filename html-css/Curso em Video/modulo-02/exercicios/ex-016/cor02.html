<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Gradiente em CSS</title>
        <style>
            * {
                height: 100%;
            }

            body {
                /* param1: direção, pode indicar por extenso ou em graus (e.g. 90deg)*/
                background-image: linear-gradient(to top, #544770, #6632D7);
                background-attachment: fixed;
            }

            h1 {
                color: #ffffffff;
            }
        </style>
    </head>
    <body>
        <h1>Testando Gradiente</h1>
    </body>
</html>
